<!DOCTYPE html>

                <div class="black"></div>
                <div class="white"></div>
                <div class="black"></div>
                <div class="white"></div>
            </div>
            <div class="clear"></div>
            <div class="row">
                <div class="white"><img src="img/gold-pawn.png" alt="White pawn"></div>
                <div class="black"><img src="img/gold-pawn.png" alt="White pawn"></div>
